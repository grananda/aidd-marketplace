name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Tres versiones que se olvidan solas, y un README que se queda atras.
      # `81fa321` es el aviso: modifico diecinueve SKILL.md y subio una version,
      # y dieciocho skills quedaron anunciando la de antes. El script mira solo lo
      # que toca el PR, que es lo unico que se puede exigir sin discutir.
      - name: Las versiones acompanan a lo que cambia
        if: github.event_name == 'pull_request'
        run: python3 .github/scripts/check_versions.py "origin/${{ github.base_ref }}"

      - name: Manifiestos validos y rutas existentes
        run: python3 .github/scripts/check_manifests.py

      - name: Frontmatter de los skills
        run: python3 .github/scripts/check_skills.py

      # Los plugins se instalan sueltos: uno que invoque un script de otro falla
      # en tiempo de uso. Un `git mv` entre plugins lo rompe sin hacer ruido.
      - name: Cada plugin trae lo que ejecuta
        run: python3 .github/scripts/check_plugin_assets.py

      # La carga de los skills es en diferido: una ruta que no resuelve no da
      # error, simplemente deja sin aplicar la regla que hubiera en ese fichero.
      - name: Las rutas de los skills resuelven
        run: python3 .github/scripts/check_skill_refs.py

      # Un skill y su script son productor y consumidor del mismo formato, escrito
      # en dos sitios. Cuando divergen no falla la CI: falla el usuario a mitad de
      # un comando, que es donde peor se diagnostica.
      - name: Lo documentado coincide con lo implementado
        run: python3 .github/scripts/check_contracts.py

      # Los .html de metodologia son generados. Si el .md cambia y el .html no,
      # la documentacion publicada miente.
      - name: HTML de metodologia regenerado
        run: python3 .github/scripts/check_generated_html.py

      - name: Scripts Python compilan
        run: |
          find plugins .github/scripts -name '*.py' -not -path '*__pycache__*' -print0 \
            | xargs -0 python3 -m py_compile && echo "Todos compilan."

      - name: Ningun comando se queda sin auditoria
        run: python3 .github/scripts/check_audit_mandatory.py

      - name: Toda invocacion de script dice como resolver su ruta
        run: python3 .github/scripts/check_script_resolution.py

      - name: Los scripts que producen entregables se ejecutan
        run: |
          pip install --quiet python-docx
          python3 .github/scripts/check_scripts_run.py

      - name: El registro de actividad lo escribe uno solo
        run: python3 .github/scripts/check_activity_source.py

      - name: El hook de actividad registra igual en Claude Code y en Codex
        run: python3 .github/scripts/check_activity_hook.py

      - name: Sin mojibake en los markdown
        run: |
          find . -name '*.md' -not -path './.git/*' -not -path './native-ai-specs-v*' -print0 \
            | xargs -0 python3 plugins/aisdd/skills/aisdd-specs/scripts/check_mojibake.py
