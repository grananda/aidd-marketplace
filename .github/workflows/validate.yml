name: Validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # La version global se olvida sola. Si algun plugin cambia de version y
      # VERSION no, el release saldria sin reflejar el cambio (o no saldria).
      - name: La version global acompana a los plugins
        if: github.event_name == 'pull_request'
        run: |
          BASE="origin/${{ github.base_ref }}"
          CHANGED=$(git diff --name-only "$BASE"...HEAD -- 'plugins/*/.claude-plugin/plugin.json')
          [ -z "$CHANGED" ] && { echo "Ningun plugin.json tocado."; exit 0; }
          BUMPED=""
          for f in $CHANGED; do
            OLD=$(git show "$BASE:$f" 2>/dev/null | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])' 2>/dev/null || echo "")
            NEW=$(python3 -c 'import json;print(json.load(open("'"$f"'"))["version"])')
            [ "$OLD" != "$NEW" ] && BUMPED="$BUMPED $f($OLD->$NEW)"
          done
          [ -z "$BUMPED" ] && { echo "Plugins tocados pero sin cambio de version."; exit 0; }
          echo "Plugins con version nueva:$BUMPED"
          if git diff --quiet "$BASE"...HEAD -- VERSION; then
            echo "::error::Algun plugin cambio de version pero VERSION sigue igual ($(cat VERSION)). Subela: es la que dispara el release."
            exit 1
          fi
          echo "VERSION -> $(cat VERSION). Correcto."

      # La comprobacion de arriba va en un solo sentido: plugin -> VERSION. Faltaba
      # la otra, contenido -> plugin, y por ahi se cuelan cambios que el usuario
      # nunca recibe: Claude Code cree que su copia instalada esta al dia.
      - name: Cada plugin tocado sube su version
        if: github.event_name == 'pull_request'
        run: |
          BASE="origin/${{ github.base_ref }}"
          FALLOS=""
          for p in plugins/*/; do
            NAME=$(basename "$p")
            git diff --quiet "$BASE"...HEAD -- "$p" && continue
            MAN="${p}.claude-plugin/plugin.json"
            OLD=$(git show "$BASE:$MAN" 2>/dev/null \
                  | python3 -c 'import json,sys;print(json.load(sys.stdin)["version"])' 2>/dev/null || echo "")
            [ -z "$OLD" ] && { echo "$NAME es nuevo en esta rama."; continue; }
            NEW=$(python3 -c 'import json;print(json.load(open("'"$MAN"'"))["version"])')
            if [ "$OLD" = "$NEW" ]; then
              FALLOS="$FALLOS $NAME($NEW)"
            else
              echo "$NAME $OLD -> $NEW. Correcto."
            fi
          done
          if [ -n "$FALLOS" ]; then
            echo "::error::Plugins con ficheros modificados y la misma version:$FALLOS. Subela, o los usuarios ya instalados no recibiran el cambio."
            exit 1
          fi

      - name: Manifiestos validos y rutas existentes
        run: python3 .github/scripts/check_manifests.py

      - name: Frontmatter de los skills
        run: python3 .github/scripts/check_skills.py

      # Los plugins se instalan sueltos: uno que invoque un script de otro falla
      # en tiempo de uso. Un `git mv` entre plugins lo rompe sin hacer ruido.
      - name: Cada plugin trae lo que ejecuta
        run: python3 .github/scripts/check_plugin_assets.py

      # La carga de los skills es en diferido: una ruta que no resuelve no da
      # error, simplemente deja sin aplicar la regla que hubiera en ese fichero.
      - name: Las rutas de los skills resuelven
        run: python3 .github/scripts/check_skill_refs.py

      # Un skill y su script son productor y consumidor del mismo formato, escrito
      # en dos sitios. Cuando divergen no falla la CI: falla el usuario a mitad de
      # un comando, que es donde peor se diagnostica.
      - name: Lo documentado coincide con lo implementado
        run: python3 .github/scripts/check_contracts.py

      # Los .html de metodologia son generados. Si el .md cambia y el .html no,
      # la documentacion publicada miente.
      - name: HTML de metodologia regenerado
        run: python3 .github/scripts/check_generated_html.py

      - name: Scripts Python compilan
        run: |
          find plugins .github/scripts -name '*.py' -not -path '*__pycache__*' -print0 \
            | xargs -0 python3 -m py_compile && echo "Todos compilan."

      - name: Toda invocacion de script dice como resolver su ruta
        run: python3 .github/scripts/check_script_resolution.py

      - name: Los scripts que producen entregables se ejecutan
        run: python3 .github/scripts/check_scripts_run.py

      - name: El registro de actividad lo escribe uno solo
        run: python3 .github/scripts/check_activity_source.py

      - name: El hook de actividad registra igual en Claude Code y en Codex
        run: python3 .github/scripts/check_activity_hook.py

      - name: Sin mojibake en los markdown
        run: |
          find . -name '*.md' -not -path './.git/*' -not -path './native-ai-specs-v*' -print0 \
            | xargs -0 python3 plugins/aisdd/skills/aisdd-specs/scripts/check_mojibake.py
